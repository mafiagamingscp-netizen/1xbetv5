<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سحب الأموال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#4682b4; --blue-off:#b1c2cd; --green:#759e2e; --green-dark:#5b8235;
  --navy:#0c2e4b; --label:#528ab9; --title:#56809f; --sky:#d0dae1; --line:#e8ebf2;
  --overlay:rgba(31,60,90,.553); --ink:#2d3842;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Sans Arabic','Segoe UI',Roboto,Tahoma,Arial,sans-serif;
  background:#eef1f5;color:var(--navy);direction:rtl;
}
body.lock{overflow:hidden}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
.app{max-width:480px;margin:0 auto;background:#fff;min-height:100vh;position:relative;box-shadow:0 0 0 1px #dfe4ea}

/* ---------- header ---------- */
.header{
  position:sticky;top:0;z-index:60;height:55.5px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 14px;
}
.header h1{
  position:absolute;left:0;right:0;text-align:center;font-size:19px;font-weight:300;color:var(--title);
  pointer-events:none;line-height:1;
}
.hbtn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;z-index:1}
.hbtn svg{display:block}
#reloadBtn{color:#488dd2}
#backBtn{color:var(--title)}
#reloadBtn.busy{opacity:.4;pointer-events:none}
#reloadBtn.busy svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- account block ---------- */
.acct{position:relative;height:152.5px}
.acct>*{position:absolute}
.acct-label{top:10px;right:10px;font-size:15px;line-height:24px;color:var(--navy)}
.acct-num{top:34px;right:10px;height:30px;display:flex;align-items:center;gap:8px;direction:rtl}
.acct-num b{font-size:16px;font-weight:700;letter-spacing:0;color:var(--navy);direction:ltr;font-family:Roboto,Arial,sans-serif}
.copy{width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:#456d3c}
.btn-types{
  top:71.5px;right:10px;width:100px;height:32px;background:var(--blue);color:#fff;
  font-size:13px;font-weight:400;line-height:1;white-space:nowrap;
}
.btn-types:active{filter:brightness(.92)}
.tab{
  top:101.5px;left:10px;height:30px;padding:0 10px;background:var(--green);color:#fff;z-index:3;
  display:flex;align-items:center;gap:11px;font-size:13px;min-width:102.5px;white-space:nowrap;
}
.tab svg{transition:transform .25s}
.tab.open svg{transform:rotate(180deg)}

/* dropdown that overlays the page */
.panel{
  top:129.5px;left:10px;right:10px;z-index:2;background:var(--green);
  max-height:0;overflow:hidden;transition:max-height .28s ease;
}
.panel-in{padding-bottom:4px}
.panel-top{height:41px;display:flex;align-items:flex-start;justify-content:flex-start;padding:3px 4px 0}
.refresh-btn{
  height:35px;width:100.5px;background:var(--green-dark);color:#fff;font-size:12.5px;gap:6px;
  display:flex;align-items:center;justify-content:center;white-space:nowrap;
}
.refresh-btn svg{flex:none}
.refresh-btn[disabled]{opacity:.55;cursor:default}
.refresh-btn .timer{font-family:Roboto,Arial,sans-serif;font-size:12.5px;direction:ltr}
.refresh-btn.cool{width:128px}
.list{background:#fff;margin:0 4px;max-height:60vh;overflow:auto}
.req + .req{border-top:1px solid #e3e8ee}
.row{display:grid;grid-template-columns:1fr 1fr;height:30.5px;padding-bottom:3px;align-items:center;font-size:13px}
.row span:first-child{color:var(--label);padding-right:20px}
.row span:last-child{color:var(--navy);padding-right:1px;direction:ltr;text-align:right;font-family:Roboto,'Noto Sans Arabic',Arial,sans-serif;font-size:13px}

/* ---------- accordion ---------- */
.acc{margin:0 10px;background:#e0e0e0}
.acc-head{
  width:100%;height:51.5px;padding:0 11px 6px;display:flex;align-items:center;gap:0;text-align:right;color:var(--ink);
}
.acc-head .chev{width:17.5px;height:9px;flex:none;margin-left:21px;transition:transform .25s}
.acc.open .chev{transform:rotate(180deg)}
.acc-head .bang{
  width:33px;height:33px;border-radius:50%;background:var(--ink);color:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;line-height:1;
}
.acc-head .t{font-size:14px;font-weight:500;margin-right:5px;color:var(--ink)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .28s ease;font-size:13px;color:var(--ink);padding:0 14px}
.acc.open .acc-body{padding:2px 14px 14px}
.acc-body a{color:var(--blue);font-weight:600;direction:ltr;unicode-bidi:embed}

/* ---------- support banner ---------- */
.banner{
  margin:33px 13px 0;height:50px;position:relative;overflow:hidden;border-radius:2px;
  background:linear-gradient(90deg,#003060 0%,#0079ca 100%);
  display:flex;align-items:center;direction:rtl;padding-right:1px;
}
.banner img{position:absolute;left:0;top:0;height:50px;width:160px;display:block}
.banner .ico{
  width:26px;height:26px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;z-index:1;
}
.banner .ico + .ico{margin-right:6px}
.banner .txt{margin-right:10px;color:#fff;font-size:13px;font-weight:500;z-index:1;white-space:nowrap}

/* ---------- payment systems ---------- */
.methods{margin-top:13px;background:var(--sky);padding:10px 10px 11px;scroll-margin-top:56px}
.methods h2{
  font-size:13px;font-weight:300;line-height:20px;text-align:center;color:var(--navy);padding-right:20px;margin-bottom:12px;
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;display:block;width:100%;text-align:center;position:relative;transition:box-shadow .15s}
.card .logo{height:55px;display:flex;align-items:center;justify-content:center;background:#fff}
.card .logo img{display:block;transition:transform .15s}
.card .name{display:flex;height:40px;align-items:center;justify-content:center;background:var(--blue);color:#fff;font-family:Roboto,Arial,sans-serif;font-size:13px}
.card:not(.off):active{box-shadow:0 0 10px rgba(0,0,0,.28)}
.card:not(.off):active .logo img{transform:scale(.84)}
.card.off{cursor:default}
.card.off .name{background:var(--blue-off)}

/* ---------- modal ---------- */
.overlay{
  position:fixed;top:55.5px;bottom:0;left:50%;width:100%;max-width:480px;transform:translateX(-50%);
  background:var(--overlay);z-index:40;display:none;align-items:center;justify-content:center;
}
.overlay.show{display:flex}
.modal{width:calc(100% - 18px);background:#ededed;box-shadow:0 2px 14px rgba(0,0,0,.25);animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.m-top{height:92px;background:#fff;position:relative;display:flex;align-items:center;justify-content:center}
.m-top img{display:block}
.m-close{position:absolute;top:12px;right:14px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:#ccc}
.m-form{padding:21px 12px 12px}
.m-row{display:grid;grid-template-columns:1fr 1fr;align-items:center}
.m-row + .m-row{margin-top:16px}
.m-label{font-size:12.5px;line-height:18.5px;color:#1d3a59;font-weight:400}
.m-label b{font-weight:600;font-family:Roboto,Arial,sans-serif;font-size:12px;white-space:nowrap}
.m-field input{
  width:100%;height:24.5px;border:1px solid #8f9da8;background:#fff;text-align:center;font-size:16px;
  color:#1f72ad;font-weight:500;outline:0;border-radius:0;font-family:Roboto,Arial,sans-serif;direction:ltr;
}
.m-field input:focus{border-color:#4682b4}
.m-field input.bad{border-color:#d9534f}
.m-field .count{height:13px;line-height:13px;font-size:11.5px;color:#1d3a59;text-align:right;direction:ltr;font-family:Roboto,Arial,sans-serif;padding-right:1px}
.m-row .m-field{padding-bottom:0}
.m-submit{
  margin-top:6.5px;width:100%;height:34px;background:var(--green);color:#fff;font-size:15px;font-weight:400;
  display:block;
}
.m-submit[disabled]{opacity:.65}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#1f3c5a;color:#fff;
  padding:10px 18px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:88%;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script src="wallet.js"></script>
</head>

<script>
/* =========================  الإعدادات  ========================= */
const CONFIG = {
  get accountId(){ return (window.X4 && X4.uid()) || ''; },   // رقم اللاعب (نفس ID التسجيل)
  currency: 'EGP',
  minAmount: 250,
  maxAmount: 20000,
  refreshCooldown: 15,              // ثواني الانتظار بعد "تحديث الحالات"
  supportEmail: 'support@example.com',
  telegramUrl: '#',                 // رابط تيليجرام للدعم
  supportUrl: '#',                  // رابط فريق الدعم
  // ← اربط هنا الـ API بتاعك. لازم ترجّع Promise.
  async submitWithdrawal(req){
    await new Promise(r => setTimeout(r, 900));
    const q = X4.addRequest('withdrawal', { amount: req.amount, method: req.method, phone: req.phone });
    if(!q) return { ok: false };
    return { ok: true, status: q.status, rid: q.id };
  },
  // ← اربط هنا جلب حالات الطلبات من السيرفر (اختياري).
  async fetchStatuses(list){
    await new Promise(r => setTimeout(r, 300));
    const all = X4.requests('withdrawal');
    return list.map(x => { const q = x.rid && all.find(a => a.id === x.rid); return q ? Object.assign({}, x, { status: q.status }) : x; });
  }
};

/* ========================  أنظمة الدفع  ========================

/* ===========================  أدوات  =========================== */
const $ = s => document.querySelector(s);
const toast = (() => { let t; return msg => { const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(t); t=setTimeout(()=>el.classList.remove('show'),2200); }; })();
const src = m => 'data:image/png;base64,' + m.logo;
const pad = n => String(n).padStart(2,'0');
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem('wd_requests')||'[]'); }catch(e){ return []; } },
  set(v){ try{ localStorage.setItem('wd_requests', JSON.stringify(v)); }catch(e){} }
};
let requests = store.get();
CONFIG.fetchStatuses(requests).then(r=>{requests=r;store.set(r);if(typeof renderList==='function')renderList()});

$('#acctId').textContent = CONFIG.accountId || '—';
$('#mailLink').textContent = CONFIG.supportEmail;
$('#mailLink').href = 'mailto:' + CONFIG.supportEmail;
$('#banner').href = CONFIG.supportUrl;
$('#tgBtn').addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); if(CONFIG.telegramUrl!=='#') window.open(CONFIG.telegramUrl,'_blank'); });
$('#banner').addEventListener('click', e => { if(CONFIG.supportUrl==='#') e.preventDefault(); });

/* ---------- شبكة أنظمة الدفع ---------- */
$('#grid').innerHTML = METHODS.map(m => `
  <button class="card ${m.on?'':'off'}" data-id="${m.id}" ${m.on?'':'aria-disabled="true"'}>
    <div class="logo"><img src="${src(m)}" style="width:${m.gw}px" alt=""></div>
    <div class="name">${m.name}</div>
  </button>`).join('');
$('#grid').addEventListener('click', e => {
  const c = e.target.closest('.card'); if(!c || c.classList.contains('off')) return;
  openModal(METHODS.find(m => m.id === c.dataset.id));
});

/* ---------- لوحة طلبات السحب ---------- */
const panel = $('#panel'), tab = $('#reqTab');
function renderList(){
  const rows = r => [
    ['تاريخ تقديم الطلب', r.date], ['الدفع ممكن مع', r.method], ['طريقة الدفع', r.type],
    ['المبلغ', r.amount], ['الحالة:', r.status]
  ].map(([k,v]) => `<div class="row"><span>${k}</span><span>${v}</span></div>`).join('');
  const empty = {date:'-',method:'-',type:'-',amount:'-',status:'-'};
  $('#list').innerHTML = (requests.length ? requests : [empty]).map(r => `<div class="req">${rows(r)}</div>`).join('');
  if(tab.classList.contains('open')) panel.style.maxHeight = panel.scrollHeight + 'px';
}
function setPanel(open){
  tab.classList.toggle('open', open); tab.setAttribute('aria-expanded', open);
  panel.style.maxHeight = open ? panel.scrollHeight + 'px' : '0px';
}
tab.addEventListener('click', () => setPanel(!tab.classList.contains('open')));
renderList();

/* ---------- تحديث الحالات + العدّاد ---------- */
let cool = null;
async function refreshStatuses(){
  requests = await CONFIG.fetchStatuses(requests); store.set(requests); renderList();
}
$('#refreshBtn').addEventListener('click', async () => {
  const b = $('#refreshBtn'); if(b.disabled) return;
  let left = CONFIG.refreshCooldown;
  b.disabled = true; b.classList.add('cool'); $('#timer').hidden = false;
  const tick = () => { $('#timer').textContent = '00:' + pad(left); };
  tick();
  cool = setInterval(() => {
    left--; tick();
    if(left <= 0){ clearInterval(cool); b.disabled = false; b.classList.remove('cool'); $('#timer').hidden = true; }
  }, 1000);
  await refreshStatuses();
});
$('#reloadBtn').addEventListener('click', async () => {
  const b = $('#reloadBtn'); b.classList.add('busy');
  await refreshStatuses(); setTimeout(() => b.classList.remove('busy'), 600);
});

/* ---------- باقي الأزرار ---------- */
$('#backBtn').addEventListener('click', () => location.href = 'maino.html');
$('#typesBtn').addEventListener('click', () => $('#methods').scrollIntoView({behavior:'smooth', block:'start'}));
$('#copyBtn').addEventListener('click', async () => {
  try{ await navigator.clipboard.writeText(CONFIG.accountId); }
  catch(e){ const t=document.createElement('textarea'); t.value=CONFIG.accountId; document.body.appendChild(t); t.select(); try{document.execCommand('copy');}catch(_){} t.remove(); }
  toast('تم النسخ');
});
$('#accHead').addEventListener('click', () => {
  const a = $('#acc'), open = !a.classList.contains('open');
  a.classList.toggle('open', open); $('#accHead').setAttribute('aria-expanded', open);
  $('#accBody').style.maxHeight = open ? $('#accBody').scrollHeight + 30 + 'px' : '0px';
});

/* ============================  النافذة  ============================ */
let current = null;
const amount = $('#amount'), phone = $('#phone');
function openModal(m){
  current = m;
  const img = $('#mLogo'); img.src = src(m); img.style.width = (m.mw || m.gw) + 'px';
  $('#phoneLabel').textContent = m.label;
  amount.value = '50.00'; phone.value = ''; $('#cnt').textContent = '0';
  amount.classList.remove('bad'); phone.classList.remove('bad');
  $('#overlay').classList.add('show'); document.body.classList.add('lock');
}
function closeModal(){ $('#overlay').classList.remove('show'); document.body.classList.remove('lock'); current = null; }
$('#mClose').addEventListener('click', closeModal);
$('#overlay').addEventListener('click', e => { if(e.target.id === 'overlay') closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && current) closeModal(); });

phone.addEventListener('input', () => {
  phone.value = phone.value.replace(/[^\d]/g, '').slice(0, 11);
  $('#cnt').textContent = phone.value.length; phone.classList.remove('bad');
});
amount.addEventListener('input', () => {
  amount.value = amount.value.replace(/[^\d.]/g, '').replace(/(\..*)\./g, '$1'); amount.classList.remove('bad');
});
amount.addEventListener('blur', () => {
  const v = parseFloat(amount.value); if(!isNaN(v)) amount.value = v.toFixed(2);
});

$('#submitBtn').addEventListener('click', async () => {
  const v = parseFloat(amount.value), p = phone.value;
  if(isNaN(v) || v < CONFIG.minAmount || v > CONFIG.maxAmount){
    amount.classList.add('bad'); return toast(`المبلغ يجب أن يكون بين ${CONFIG.minAmount} و ${CONFIG.maxAmount.toLocaleString('en-US')} ${CONFIG.currency}`);
  }
  if(p.length !== 11 || !p.startsWith('01')){
    phone.classList.add('bad'); return toast('أدخل رقماً صحيحاً مكوّناً من 11 رقم');
  }
  if(!X4.session()) return toast('سجّل الدخول أولاً');
  if(v > X4.balance(X4.uid())) return toast('الرصيد غير كافٍ');
  const btn = $('#submitBtn'); btn.disabled = true;
  try{
    const res = await CONFIG.submitWithdrawal({ method: current.id, amount: v, phone: p, account: CONFIG.accountId });
    if(!res || !res.ok) throw new Error();
    const d = new Date();
    requests.unshift({
      date: `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`,
      method: current.name, type: 'محفظة إلكترونية',
      amount: `${v.toFixed(2)} ${CONFIG.currency}`, status: res.status || 'قيد المعالجة', rid: res.rid
    });
    store.set(requests); renderList(); closeModal(); setPanel(true); toast('تم إرسال طلب السحب');
  }catch(e){ toast('حدث خطأ، حاول مرة أخرى'); }
  finally{ btn.disabled = false; }
});
</script>
</body>
